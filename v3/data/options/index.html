<!DOCTYPE html>
<html>
<head>
  <title>Options :: Gif Blocker</title>
  <link rel="stylesheet" type="text/css" href="index.css">
</head>
<body>
  <div id="preferences">
    <input type="checkbox" id="gif">
    <label for="gif">Block "GIF" animation type</label>
    <input type="checkbox" id="webp">
    <label for="webp">Block "WebP" animation type</label>
    <input type="checkbox" id="css">
    <label for="css">Block "CSS" animation</label>
    <input type="checkbox" id="video">
    <label for="video">Pause video playing</label>
  </div>

  <p>
    <input type="button" value="Reset" id="reset">
    <input type="button" value="Support Development" id="support">
  </p>
  <p>
    <input type="button" value="Save Options" id="save">
    <span id="toast"></span>
  </p>
  <script type="text/javascript" src="index.js"></script>
</body>
</html>
